name: Daily London plates

on:
  schedule:
    # 06:41 UTC. Deliberately not on the hour: scheduled workflows queue behind the
    # top-of-hour rush and can be delayed by an hour or dropped under load.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: the generator is standard library only, so there
      # is nothing to pin and nothing to rot.
      - name: Render plates
        run: python3 tools/build_plates.py

      - name: Commit if anything changed
        run: |
          # A committer that is not a GitHub account keeps this out of the repo's
          # Contributors panel and off anyone's contribution graph, so a year of
          # automated commits does not read as human activity.
          git config user.name "london-plates"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Update London plates"
            git push
          fi
